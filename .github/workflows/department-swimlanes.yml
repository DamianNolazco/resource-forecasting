name: Apply department swimlanes

on:
  push:
    paths:
      - DEPARTMENT_SWIMLANES

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger department swimlanes update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planner changes
        run: python scripts/apply_department_swimlanes.py
      - name: Commit planner changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Group project resources into collapsible department swimlanes"
          git push
