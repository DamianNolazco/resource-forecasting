name: Build Windows local planner
on:
  push:
    branches: [build/windows-exe]
    paths: ['windows/**', '.github/workflows/windows-exe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test Excel database operations
        run: python windows/test_local.py
      - name: Install executable builder
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Resource_Planner windows/Resource_Planner.py
      - name: Test actual compiled executable
        run: python windows/smoke_exe.py dist/Resource_Planner.exe
      - name: Assemble Windows package
        shell: pwsh
        run: |
          Copy-Item windows/Resource_Planning_Database.xlsx dist/
          Copy-Item windows/Instructions_Windows.txt dist/
          Copy-Item windows/THIRD_PARTY_NOTICES.txt dist/
          Get-FileHash dist/Resource_Planner.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Resource_Planner_Windows_x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
