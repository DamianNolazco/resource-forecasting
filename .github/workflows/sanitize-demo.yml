name: Apply monthly resource planner UI

on:
  push:
    paths:
      - APPLY_MONTHLY_UI

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply monthly planner files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          page = ''''''
          css = ''''''
          Path('app/page.tsx').write_bytes(gzip.decompress(base64.b64decode(page)))
          Path('app/globals.css').write_bytes(gzip.decompress(base64.b64decode(css)))
          PY
      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Switch planner to monthly resource allocation view"
          git push
