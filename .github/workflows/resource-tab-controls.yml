name: Apply resource controls and capacity axis

on:
  push:
    paths:
      - RESOURCE_TAB_CONTROLS

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger resource controls update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update resource UX and capacity scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          resources = base64.b64decode('').decode()
          css_extra = base64.b64decode('').decode()
          page = Path('app/page.tsx')
          text = page.read_text()
          text = text.replace('const people:Person[] = [', 'const seedPeople:Person[] = [', 1)
          text = text.replace('  const [bars,setBars] = useState<PlanBar[]>(seedBars);', '  const [bars,setBars] = useState<PlanBar[]>(seedBars);\n  const [people,setPeople] = useState<Person[]>(seedPeople);', 1)
          text = text.replace('  }),[bars]);', '  }),[bars,people]);', 1)
          text = text.replace('{view==="resources"&&<ResourcesView year={resourceYear} setYear={setResourceYear} allocationFor={allocationFor}/>} ', '{view==="resources"&&<ResourcesView year={resourceYear} setYear={setResourceYear} allocationFor={allocationFor} people={people} onAdd={person=>setPeople(current=>[...current,person])}/>} ', 1)
          text = text.replace('{selectedBar&&<BarDrawer bar={selectedBar}', '{selectedBar&&<BarDrawer bar={selectedBar} people={people}', 1)
          text = text.replace('function BarDrawer({bar,onClose,onUpdate,onDelete}:{bar:PlanBar;onClose:()=>void;onUpdate:(patch:Partial<PlanBar>)=>void;onDelete:()=>void}){', 'function BarDrawer({bar,people,onClose,onUpdate,onDelete}:{bar:PlanBar;people:Person[];onClose:()=>void;onUpdate:(patch:Partial<PlanBar>)=>void;onDelete:()=>void}){', 1)
          text, count = re.subn(r'function ResourcesView\(.*?\nfunction ProjectsView', resources + '\n\nfunction ProjectsView', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace ResourcesView/CapacityView block')
          page.write_text(text)
          css = Path('app/globals.css')
          css.write_text(css.read_text() + css_extra)
          PY
      - name: Commit UI updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Add resource search filters and capacity axis"
          git push
